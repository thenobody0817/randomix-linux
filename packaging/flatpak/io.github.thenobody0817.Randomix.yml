app-id: io.github.thenobody0817.Randomix
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: randomix

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: randomix
    buildsystem: simple
    build-commands:
      # The Flutter release bundle is copied as-is so the binary keeps finding
      # its libraries through the $ORIGIN/lib RPATH.
      - mkdir -p /app/randomix
      - cp -a ./. /app/randomix/
      - mkdir -p /app/bin
      - ln -sf /app/randomix/randomix /app/bin/randomix
      - install -Dm644 io.github.thenobody0817.Randomix.desktop /app/share/applications/io.github.thenobody0817.Randomix.desktop
      - install -Dm644 io.github.thenobody0817.Randomix.metainfo.xml /app/share/metainfo/io.github.thenobody0817.Randomix.metainfo.xml
      - install -Dm644 io.github.thenobody0817.Randomix.png /app/share/icons/hicolor/512x512/apps/io.github.thenobody0817.Randomix.png
    sources:
      - type: dir
        path: ../../build/linux/x64/release/bundle
      - type: file
        path: ../io.github.thenobody0817.Randomix.desktop
      - type: file
        path: ../io.github.thenobody0817.Randomix.metainfo.xml
      - type: file
        path: ../icons/hicolor/512x512/apps/io.github.thenobody0817.Randomix.png
        dest-filename: io.github.thenobody0817.Randomix.png
